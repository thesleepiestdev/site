<head>
<style>
*{margin:0;padding:0;}
.embed-container{position:relative;height:100vh;overflow:hidden;}
.embed-container iframe, .embed-container object, .embed-container embed {position:absolute;top:0;left:0;width:100%;height: 100%;}
.logo{ position:absolute;top:20px;left:20px;}
html{overflow:scroll;}
::-webkit-scrollbar{width:0px;background:transparent;}
    </style>
  </head>

  <body>
    <div class="embed-container">
      <div id="player"></div>
    </div>
    <script>
  var urlParams = new URLSearchParams(window.location.search);
  var SETTINGS = {
    playlist_id: urlParams.get('playlist') || 'PL291D6ScLmyLL7lzp9oeHsQEffSPqrUzA',
    autoplay: 1,
    loop: 1,
    index: 0,
    startSeconds: 0,
  };

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '540',
      width: '960',
      playerVars: {
        version: 3,
        autoplay: SETTINGS.autoplay,
        loop: SETTINGS.loop,
        index: SETTINGS.index,
        rel: 0,
        start: SETTINGS.startSeconds,
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange,
      },
    });
  }

  function onPlayerReady(event) {
    player.loadPlaylist({
      listType: 'playlist',
      list: SETTINGS.playlist_id,
      autoplay: 1
    });
    player.setVolume(50);

    // Wait a moment for playlist info, then sync
    setTimeout(syncWithUTCTime, 2000);
  }

  function syncWithUTCTime() {
    var playlistArray = player.getPlaylist();
    var playListArrayLength = playlistArray.length;

    if (!playListArrayLength) return;

    // Current UTC seconds
    var utcSeconds = Math.floor(Date.now() / 1000);

    // Pick which video should play
    var videoIndex = utcSeconds % playListArrayLength;

    player.playVideoAt(videoIndex);

    // Once it's playing, seek to correct position inside video
    setTimeout(() => {
      var duration = player.getDuration();
      if (duration > 0) {
        var seekTime = utcSeconds % duration;
        player.seekTo(seekTime, true);
      }
    }, 2000);
  }

  function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.ENDED) {
      // Instead of random, just resync with UTC
      syncWithUTCTime();
    }
  }
</script>

	<span class="logo"><img src="thistv2hdDOG.png" width="100%" height="100%"></span>
  </body>

</html>
